# VHolograms
#
# FancyHolograms sigue siendo la fuente de verdad para el texto y las
# propiedades generales del holograma. VHolograms solo guarda los estilos
# adicionales por línea en data.yml.

settings:
  # Separación vertical base entre líneas a escala 1.0.
  # --gap-before y --gap-after permiten ajustar casos concretos.
  default_line_height: 0.24
