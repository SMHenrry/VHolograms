name: VHolograms
version: 0.2.4
main: net.vahmur.holograms.VHologramsPlugin
api-version: '1.21'
author: SMHenrry
description: Extensión de FancyHolograms desarrollada para Vahmur Network.

depend:
  - FancyHolograms
softdepend:
  - Nexo

commands:
  vholo:
    description: Administra las extensiones por línea de VHolograms.
    usage: /vholo <info|version|reload|status|rebuild|clear>
    aliases: [vholograms]
    permission: vholograms.admin

permissions:
  vholograms.admin:
    description: Permite administrar VHolograms.
    default: op
