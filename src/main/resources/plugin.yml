name: VHolograms
version: 0.1.0
main: net.vahmur.holograms.VHologramsPlugin
api-version: '1.21'
author: Vahmur
website: https://fancyinnovations.com/docs/minecraft-plugins/fancyholograms

depend:
  - FancyHolograms
softdepend:
  - Nexo

commands:
  vholo:
    description: Administra los hologramas avanzados de Vahmur.
    usage: /vholo <reload|status|rebuild>
    aliases: [vholograms]
    permission: vholograms.admin

permissions:
  vholograms.admin:
    description: Permite administrar VHolograms.
    default: op
