name: VHolograms
version: 0.2.1
main: net.vahmur.holograms.VHologramsPlugin
api-version: '1.21'
author: Vahmur

depend:
  - FancyHolograms
softdepend:
  - Nexo

commands:
  vholo:
    description: Administra las extensiones por línea de VHolograms.
    usage: /vholo <reload|status|rebuild|clear>
    aliases: [vholograms]
    permission: vholograms.admin

permissions:
  vholograms.admin:
    description: Permite administrar VHolograms.
    default: op
