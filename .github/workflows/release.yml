name: Release

on:
  push:
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release branch: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven version
        shell: bash
        run: |
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$PROJECT_VERSION" != "${{ steps.version.outputs.number }}" ]]; then
            echo "pom.xml version is $PROJECT_VERSION, but release branch requests ${{ steps.version.outputs.number }}"
            exit 1
          fi

      - name: Build
        run: mvn --batch-mode --update-snapshots package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.tag }}
          VERSION_NUMBER: ${{ steps.version.outputs.number }}
        shell: bash
        run: |
          JAR="target/VHolograms-$VERSION_NUMBER.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "Expected JAR not found: $JAR"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 1
          fi

          gh release create "$VERSION" "$JAR" \
            --target main \
            --title "VHolograms $VERSION_NUMBER" \
            --generate-notes
