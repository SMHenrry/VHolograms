name: Build

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'cleanup/**', 'stable/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VHolograms
          path: target/VHolograms-*.jar
